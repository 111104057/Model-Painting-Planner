async function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('reawaken-paint-planner',1);r.onupgradeneeded=()=>r.result.createObjectStore('archive');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function readDB(key='state'){return new Promise((resolve,reject)=>{const tx=db.transaction('archive','readonly'),r=tx.objectStore('archive').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function writeDB(value,key='state'){return new Promise((resolve,reject)=>{const tx=db.transaction('archive','readwrite');tx.objectStore('archive').put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('寫入取消'))})}

function renderCollection(){const types=[...new Set(state.models.map(m=>m.type))].sort(),found=state.models.filter(m=>(!filter.query||title(m).toLowerCase().includes(filter.query.toLowerCase()))&&(filter.status===''||m.status===Number(filter.status))&&(!filter.type||m.type===filter.type)),groups=new Map();for(const m of found){if(!groups.has(m.type))groups.set(m.type,[]);groups.get(m.type).push(m)}const ids=state.models.filter(m=>selected.has(m.id)&&eligible(m)).map(m=>m.id);return head('THE ARMOURY','模型收藏','同款收成一個集合，展開查看個別武器、進度與照片。',`<button class="primary" data-action="add">＋ 新增模型</button>`)+`<div class="status-tabs" aria-label="狀態分類">${['全部',...STATUS].map((n,i)=>`<button data-action="status-tab" data-status="${i?i-1:''}" class="${filter.status===(i?String(i-1):'')?'active':''}">${n} · ${i?state.models.filter(m=>m.status===i-1).length:state.models.length}</button>`).join('')}</div><div class="toolbar"><input id="collection-search" aria-label="搜尋收藏" placeholder="搜尋模型、武器或編號…" value="${esc(filter.query)}"><select id="type-filter" aria-label="依模型種類篩選"><option value="">全部模型</option>${types.map(n=>`<option ${filter.type===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div>${ids.length?`<div class="selection-bar"><span>已選 ${ids.length} 隻可塗裝模型</span><button class="primary" data-action="batch-daily">一起記錄進度</button><button data-action="clear-selection">清除</button></div>`:''}<p class="muted" style="font-size:12px">${found.length} 隻模型 · ${groups.size} 個集合</p><div class="collection-groups">${[...groups.entries()].map(([type,list])=>`<details class="model-group" data-group="${esc(type)}" ${openGroups.has(type)?'open':''}><summary><span class="group-title"><strong>${esc(type)}</strong><small>${[...new Set(list.map(m=>m.variant||'Standard configuration'))].map(esc).join(' ／ ')}</small></span><span class="badge">${list.length} 隻</span></summary><div class="group-content"><div class="group-tools"><small>${list.filter(m=>m.status===4).length} 隻完成 · ${list.filter(m=>m.pla function modelCard(m){const numbered=state.models.filter(x=>x.type===m.type).length>1;return `<article class="card model-card"><div class="info-row" style="margin:0"><label class="model-select">${eligible(m)?`<input type="checkbox" data-select-model="${m.id}" ${selected.has(m.id)?'checked':''} aria-label="勾選 ${esc(title(m))}">`:''}<span class="model-no">${numbered?'NO.'+String(m.no).padStart(2,'0'):''}</span></label><span class="badge ${m.status===4?'':'gray'}">${STATUS[m.status]}</span></div><h3>${esc(m.type)}</h3><div class="model-variant">${esc(m.variant||'Standard configuration')}${m.custom?' · 自訂':''}</div>${progressHTML(m)}<div class="info-row"><small>${m.plan?'目標 '+m.deadline:m.status===4?'已完成上色':'尚未設定計畫'}</small><small>${m.logs.length} 筆照片紀錄</small></div><label for="status-${m.id}" class="hidden">模型狀態</label><select id="status-${m.id}" data-status-id="${m.id}">${STATUS.map((n,i)=>`<option value="${i}" ${m.status===i?'selected':''}>${n}</option>`).join('')}</select><div class="actions"><button data-action="detail" data-id="${m.id}">進度與照片</button>${eligible(m)?`<button class="primary" data-action="daily" data-id="${m.id}">記錄進度</button><button data-action="plan" data-id="${m.id}">${m.plan?'調整計畫':'安排塗裝'}</button>`:''}</div></article>`}
function renderPlanner(){const active=state.models.filter(m=>m.plan&&eligible(m)),tasks=[...state.tasks].sort((a,b)=>a.date.localeCompare(b.date)||modelBy(a.modelId).deadline.localeCompare(modelBy(b.modelId).deadline)||a.modelId.localeCompare(b.modelId)||orderedPartNames(modelBy(a.modelId)).indexOf(a.part)-orderedPartNames(modelBy(b.modelId)).indexOf(b.part)),groups=new Map();for(const t of tasks){if(!groups.has(t.date))groups.set(t.date,[]);groups.get(t.date).push(t)}return head('PAINT PROTOCOL','時程規劃','每隻自行估時，每次登錄自動更新剩餘工時與預計完工日。',`<button class="ghost" data-action="settings">可用時間設定</button><button class="primary" data-action="choose-plan">＋ 新增計畫</button>`)+rolloverHTML()+warningHTML()+pendingEstimateHTML()+`<div class="grid split"><div class="grid" style="align-content:start"><section class="card"><div class="card-head"><h2>我的塗裝時間</h2><button class="ghost" data-action="settings">編輯</button></div><div class="info-row"><span class="muted">每週可用時間</span><strong>${hours(state.settings.days.reduce((a,b)=>a+b,0))}</strong></div>${state.settings.days.map((n,i)=>n?`<div class="info-row"><span>週${'日一二三四五六'[i]}</span><span>${hours(n)}</span></div>`:'').join('')}<div class="notice">建立計畫時填寫剩餘工時與期限。依每隻模型設定的部位優先順序安排。每日實際工作由照片與備註留下紀錄。</div></section><section class="card"><div class="card-head"><h2>模型計畫</h2><span class="badge gray">${active.length}</span></div>${active.length?active.map(m=>`<div class="task"><div class="task-content"><div class="task-title">${esc(title(m))}</div><div class="task-meta">目標 ${m.deadline} · 剩餘 ${hours(m.remaining||0)}</div><div class="task-meta">預計完工：${modelFinish(state,m)||'尚待校正'}</div><div class="task-meta">優先：${orderedPartNames(m).map(esc).join(' → ')}</div>${progressHTML(m)}<div class="task-actions"><button data-action="plan" data-id="${m.id}">工時／期限／部位</button><button data-action="daily" data-id="${m.id}">記錄進度</button><button class="ghost danger" data-action="cancel-plan" data-id="${m.id}">取消計畫</button></div></div></div>`).join(''):empty('尚未安排模型','已噴底漆或上色中的模型才能加入計畫。')}</section></div><section class="card"><div class="card-head"><h2>工作日程</h2><button data-action="reschedule">重新安排</button></div><p class="muted" style="font-size:12px">優先安排較早到期的模型。登錄進度或跨日開啟後，依最新剩餘工時重新排程；手動日期也會重算。</p>${tasks.length?[...groups.entries()].slice(0,60).map(([date,items])=>`<section class="schedule-group"><div class="date-label"><span>${date} · ${fmtDate(date)}</span><span>${hours(items.reduce((n,t)=>n+t.minutes,0))}</span></div><div style="padding-top:15px">${items.map(taskHTML).join('')}</div></section>`).join('')+(groups.size>60?'<p class="muted">此處顯示前 60 個工作日；完整日程包含在備份中。</p>':''):empty('日程還是空白的','新增模型計畫後，這裡會顯示每日安排。')}</section></div>`}

function showPlan(id){const m=modelBy(id);if(!eligible(m))throw Error('只有已噴底漆或上色中的模型可以排程。');modal('安排模型計畫',`<form id="plan-form" data-id="${id}"><h3>${esc(title(m))}</h3>${timeReferenceHTML(m)}<div class="fields"><div class="field"><label for="plan-start">開始日期</label><input type="date" id="plan-start" value="${m.start}" required></div><div class="field"><label for="plan-deadline">目標完成日期</label><input type="date" id="plan-deadline" value="${m.deadline}" required></div></div><div class="field"><label for="plan-remaining">你認為目前還需要多久？（總小時）</label><input type="number" id="plan-remaining" min="0" max="8000" step="any" value="${m.remaining===null?'':m.remaining/60}" placeholder="自行估算剩餘總工時" required><small>填寫總時間後，可在下面調整各部位分配。</small></div>${priorityPlanHTML(m)}<div class="notice" id="plan-progress-preview" aria-live="polite"></div><div class="notice">優先順序會實際套用到日程：先安排第一個部位，再安排下一個部位。每日紀錄仍可依實際情況交錯處理。</div><div class="dialog-foot"><button type="button" data-action="detail" data-id="${id}">查看紀錄</button><button class="primary">儲存並依順序排程</button></div></form>`);refreshPlanProgressPreview()}

function timeReferenceHTML(m){
 const ref=sameModelTimeReference(state,m);if(!ref)return '';
 const sample=ref.latest;
 return `<section class="time-reference"><div class="eyebrow">YOUR PAINTING PACE</div><h3>同款上次完工參考</h3><p class="muted">僅比對同款模型與相同武器配置。No.${sample.no} · ${sample.completedDate} 完工</p><div class="info-row"><span>上次已記錄實際總工時</span><strong>${hours(sample.total)}</strong></div><table class="time-reference-table"><caption>上次實際部位工時${sample.unallocated?'（已知部分）':''}</caption><thead><tr><th scope="col">部位</th><th scope="col">實際工時</th></tr></thead><tbody>${sample.parts.map(p=>`<tr><th scope="row">${p.name}</th><td>${hours(p.minutes)}</td></tr>`).join('')}${sample.unallocated?`<tr><th scope="row">未分配部位</th><td>${hours(sample.unallocated)}</td></tr>`:''}</tbody></table><small>${ref.sampleCount} 隻符合條件的完工作品${ref.sampleCount>1?' · 平均總工時 '+hours(ref.averageTotal):''}。${sample.unallocated?'部分舊紀錄沒有部位工時，只套用總時間，各部位分配仍由你調整。':'可以套用上次分配，再依這次的塗裝方式修改。'}</small><button type="button" class="ghost" data-action="apply-time-reference" data-id="${m.id}">${sample.unallocated?'套用上次總工時':'套用上次工時與分配'}</button><small>套用時會按目前未完成比例換算剩餘工時，儲存後才生效。</small></section>`;
}
function refreshPlanProgressPreview(){
 const form=$('#plan-form'),label=$('#plan-progress-preview');if(!form||!label)return;
 const m=modelBy(form.dataset.id),raw=$('#plan-remaining').value,remaining=raw===''?null:minutes(raw);
 if(!Number.isInteger(remaining)||remaining<0||remaining>480000){label.textContent='設定剩餘工時後，這裡會顯示完成度的連動估計。';return}
 const target=progressAfterRemainingChange(m,remaining);
 label.textContent=target===progress(m)?`整隻模型完成度：${progress(m)}%。增加剩餘工時時，會同步重新估算完成百分比。`:`增加剩餘工時，整隻模型完成度會由 ${progress(m)}% 校正為約 ${target}%。每日照片與新增紀錄保持原樣。`;
}
function applyTimeReference(id){
 const m=modelBy(id),ref=sameModelTimeReference(state,m);if(!ref)throw Error('目前沒有同款、相同武器的完整完工工時。');
 const remaining=Math.round(ref.latest.total*(100-progress(m))/100);
 $('#plan-remaining').value=remaining/60;
 if(ref.latest.unallocated){distributePlanTotal()}
 else{
  const reference=readPriorityPlan().map(p=>({name:p.name,remaining:ref.latest.parts.find(x=>x.name===p.name)?.minutes||0})),plan=splitPartMinutes(remaining,reference);
  for(const p of plan){const row=[...$('#part-priority-list').children].find(x=>x.dataset.priorityPart===p.name);row.querySelector('[data-plan-part-hours]').value=p.remaining/60}
 }

function actualAllocationHTML(m,i,editing){

function refreshActualAllocation(i){
 const section=$(`[data-allocation-index="${i}"]`);if(!section)return;
 const names=dailySelectedParts(),worked=minutes($('#worked-'+i).value);
 for(const row of section.querySelectorAll('[data-actual-row]')){
  const selected=names.includes(row.dataset.actualRow),input=row.querySelector('input');
  row.classList.toggle('hidden',!selected);input.disabled=!selected||names.length===1;
  if(selected&&names.length===1){input.value=Number.isInteger(worked)?worked/60:'';input.dataset.autoAssigned='true'}
  else if(input.dataset.autoAssigned==='true'){input.value='';delete input.dataset.autoAssigned}
 }
}
function readActualAllocation(i,parts,worked){
 if(parts.length===1)return [{name:parts[0].name,minutes:worked}];
 const fields=parts.map(p=>$(`[data-allocation-index="${i}"] [data-actual-part="${p.name}"]`));
 if(fields.every(input=>input.value===''))return undefined;
 if(fields.some(input=>input.value===''))throw Error('部位工時若要分配，請填齊本次勾選部位；未花時間可填 0，或全部留白只記總時間。');
 const plan=fields.map((input,j)=>({name:parts[j].name,minutes:minutes(input.value)}));
 if(plan.some(p=>!Number.isInteger(p.minutes)||p.minutes<0||p.minutes>1440)||plan.reduce((n,p)=>n+p.minutes,0)!==worked)throw Error('各部位實際工時合計需等於這隻模型的當日實際塗裝時間。');
 return plan;
}

function partPicker(parts=[]){return `<div class="part-picker">${PARTS.map((name,i)=>{const p=parts.find(x=>x.name===name);return `<div class="part-option"><label><input type="checkbox" name="log-part" value="${name}" ${p?'checked':''}>${name}</label><div class="work-options">${WORKS.map(work=>`<label><input type="checkbox" name="work-${i}" value="${work}" ${p?.work.includes(work)?'checked':''}>${work}</label>`).join('')}</div></div>`}).join('')}</div>`}
function showDaily(ids,editLogId=null,focusPart=null){

 modal(editing?'修改進度紀錄':models.length>1?'批次記錄今日進度':'記錄今日進度',`<form id="daily-form" data-ids="${esc(JSON.stringify(ids))}" data-edit="${editLogId||''}">
 <p class="muted">${models.length>1?'這張合照與部位備註會存入每隻模型；百分比與工時分別記錄。':'只需記錄這一天新增的進度，完成度會自動累加。'}</p>
 <div class="field"><label for="log-date">紀錄日期（可補登）</label><input id="log-date" type="date" value="${editing?.date||today()}" max="${today()}" required></div>

 <div class="field"><label for="log-photo">${editing?'替換照片（保留現有照片可不選）':'今日照片（必填，可使用合照）'}</label><input id="log-photo" type="file" accept="image/jpeg,image/png,image/webp" ${editing?'':'required'}><small>JPG、PNG、WebP，最大 20 MB。照片會保存在瀏覽器中。</small><img id="log-photo-preview" class="daily-photo ${editing?'':'hidden'}" ${editing?`src="${editing.photo}"`:''} alt="今日進度照片預覽"></div>
 ${models.map((m,i)=>{
  const current=progress(m)-(editing?.delta||0),max=Math.min(100,100-current),min=Math.max(0,-current),worked=editing?.worked??state.tasks.filter(t=>t.modelId===m.id&&t.date===today()&&(!focusPart||t.part===focusPart)).reduce((n,t)=>n+t.minutes,0);
  return `<section class="daily-model" data-daily-model="${m.id}"><h3>${esc(title(m))}</h3>

  <div class="range-top"><span>這一天多完成了多少？</span><strong id="delta-label-${i}">+${editing?.delta||0}%</strong></div>
  <div class="range-controls"><input id="delta-${i}" type="range" min="${min}" max="${max}" step="1" value="${editing?.delta||0}" data-range-index="${i}" aria-label="${esc(title(m))} 今日新增完成百分比"><input id="delta-number-${i}" type="number" class="range-number" min="${min}" max="${max}" step="1" value="${editing?.delta||0}" data-number-index="${i}" aria-label="${esc(title(m))} 今日新增百分比數值"></div>
  <p class="muted" style="font-size:12px" id="cumulative-${i}" data-current="${current}" data-before="${progress(m)}">累積完成度：${progress(m)}% → ${current+(editing?.delta||0)}%</p>
  <div class="field"><label for="worked-${i}">這隻當日實際塗裝時間（小時）</label><input id="worked-${i}" data-worked-index="${i}" type="number" min="0" max="24" step="any" value="${worked?worked/60:''}" required></div>${actualAllocationHTML(m,i,editing)}
  <div class="notice auto-estimate"><strong id="auto-remaining-${i}"></strong><small>依新增完成比例縮減剩餘工時。實際塗裝時間另計入當日可用時間；儲存後會重新安排預計完工日。</small></div>
  <button type="button" class="ghost" data-action="toggle-estimate" data-index="${i}" id="estimate-toggle-${i}" aria-expanded="false" aria-controls="estimate-fields-${i}">手動校正工時</button>

  <label class="compact-check hidden" id="finish-wrap-${i}"><input id="finish-${i}" type="checkbox" ${editing&&progress(m)===100?'checked':''}>確認這隻模型已完工，剩餘工時設為 0</label></section>`;

 <div class="daily-total" id="daily-total"></div><small>百分比以整隻模型計算，補登也會加入總進度。例如今天 +20%、昨天補登 +15%，累積就是 35%。</small>

function updateRange(i,fromNumber=false){
 const range=$('#delta-'+i),number=$('#delta-number-'+i),cap=$('#cumulative-'+i),base=Number(cap.dataset.current),min=Math.max(0,-base),max=Math.min(100,Math.max(0,100-base));
 range.min=number.min=min;range.max=number.max=max;
 const value=Math.max(min,Math.min(max,Number(fromNumber?number.value:range.value)||0));
 range.value=number.value=value;$('#delta-label-'+i).textContent='+'+value+'%';
 cap.textContent=`累積完成度：${cap.dataset.before}% → ${base+value}%`;
 $('#finish-wrap-'+i).classList.toggle('hidden',base+value!==100);
 if(base+value!==100)$('#finish-'+i).checked=false;
 range.setAttribute('aria-valuetext',`這一天增加 ${value}%，儲存後累積 ${base+value}%`);
 refreshAutoEstimate(i);
}

function refreshAutoEstimate(i){
 const form=$('#daily-form'),fields=$('#estimate-fields-'+i);if(!form||!fields)return;
 const m=modelBy(JSON.parse(form.dataset.ids)[Number(i)]),delta=Number($('#delta-number-'+i).value),entryTotal=Number($('#cumulative-'+i).dataset.current)+delta,referenceRemaining=suggestedRemaining(m,delta,form.dataset.edit||null);
 if(fields.disabled){
  $('#remaining-'+i).value=referenceRemaining===null?'':referenceRemaining/60;
  delete $(`[data-budget-index="${i}"]`).dataset.manual;refreshDailyPartBudget(i);
 }
 const value=$('#remaining-'+i).value,remaining=value===''?null:minutes(value),valid=Number.isInteger(remaining)&&remaining>=0&&remaining<=480000;
 const target=!fields.disabled&&valid?progressAfterRemainingChange(m,remaining,entryTotal,referenceRemaining):entryTotal;
 const cap=$('#cumulative-'+i);cap.dataset.finalProgress=target;
 cap.textContent=`累積完成度：${cap.dataset.before}% → ${target}%`+(target!==entryTotal?`（本次新增 +${delta}%，工時增加後重新估算）`:'');
 $('#finish-wrap-'+i).classList.toggle('hidden',target!==100);if(target!==100)$('#finish-'+i).checked=false;
 $('#auto-remaining-'+i).textContent=target===100?'確認完工後剩餘：0 小時':!valid?'尚未設定有效估計工時，請按「手動校正工時」填寫。':`${fields.disabled?'自動更新後':'手動校正後'}剩餘：${hours(remaining)}`;
}
function toggleDailyEstimate(i){

document.addEventListener('visibilitychange',()=>{if(!document.hidden)reconcileDay(true).catch(err=>notify(err.message,true))});
setInterval(()=>reconcileDay(true).catch(err=>notify(err.message,true)),30000);
async function init(){render();try{db=await openDB();const stored=await readDB();hasLegacySnapshot=!!(await readDB('pre-v2-state'));hasPrioritySnapshot=!!(await readDB('pre-priority-state'));let converted=false,convertedPriority=false;if(stored){const next=migrateState(stored);validateState(next);if(stored.version===1){await writeDB(stored,'pre-v2-state');hasLegacySnapshot=true;converted=true;}else if(needsPriorityUpgrade(next)){if(!hasPrioritySnapshot){await writeDB(stored,'pre-priority-state');hasPrioritySnapshot=true;}convertedPriority=true;}state=next;}if(converted||convertedPriority||state.lastReconciled!==today()){rolloverNotice=state.tasks.filter(t=>t.date<today());const next=structuredClone(state);reschedule(next);next.lastReconciled=today();await commit(next);}$('#save-state').textContent='已儲存在此瀏覽器';render();showReminders();if(converted)notify('已升級收藏與照片；升級前原始備份也保留在此瀏覽器。');else if(convertedPriority)notify('已依部位更新日程；舊計畫的部位工時先平均帶入，可在計畫中校正。')}catch(err){db=null;$('#save-state').textContent='資料讀取失敗';notify('無法讀取資料：'+err.message+'。原始儲存內容未刪除，請保留此瀏覽器資料。',true)}}
init();

</script>
