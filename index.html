function footer(){return `<footer class="footer"><span>REAWAKEN · PERSONAL PAINT ARCHIVE</span><span>非官方玩家工具 · 資料僅存於目前瀏覽器 · <button class="link-button" data-action="backup">備份與還原</button></span></footer>`}

async function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('reawaken-paint-planner',1);r.onupgradeneeded=()=>r.result.createObjectStore('archive');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function readDB(){return new Promise((resolve,reject)=>{const tx=db.transaction('archive','readonly'),r=tx.objectStore('archive').get('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function writeDB(value){return new Promise((resolve,reject)=>{const tx=db.transaction('archive','readwrite');tx.objectStore('archive').put(value,'state');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('寫入取消'))})}
async function commit(next){if(!db)throw Error('瀏覽器儲存空間無法使用，請改用一般瀏覽模式。');next.savedAt=new Date().toISOString();await writeDB(next);state=next;$('#save-state').textContent='已儲存在此瀏覽器';render()}
async function mutate(fn){if(saveBusy)throw Error('正在儲存，請稍候再操作。');saveBusy=true;try{const next=structuredClone(state);await fn(next);await commit(next)}finally{saveBusy=false}}
function modelBy(id){const m=state.models.find(x=>x.id===id);if(!m)throw Error('找不到這隻模型。');return m}
function phaseData(total,ratios){const allocations=ratios.map((v,i)=>i===3?0:Math.round(total*v/100));allocations[3]=total-allocations.slice(0,3).reduce((a,b)=>a+b,0);return allocations.map(n=>({total:n,remaining:n,done:false,photo:null,doneDate:null,checks:[]}))}
function counter(s,type){return Object.hasOwn(s.counters,type)&&Number.isInteger(s.counters[type])?s.counters[type]:0} function setCounter(s,type,no){Object.defineProperty(s.counters,type,{value:no,enumerable:true,writable:true,configurable:true})} function validFinishedPhoto(photo){return typeof photo==='string'&&photo.length<6000000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(photo)}
function directFinished(m){return m.status===4&&validFinishedPhoto(m.finishedPhoto)}
function registerFinished(m,photo){if(!validFinishedPhoto(photo))throw Error('登錄完成上色模型前，請先上傳有效的完工照片。');m.finishedPhoto=photo;m.finishedRegisteredAt=m.finishedRegisteredAt||today();m.status=4;m.plan=false;for(const p of m.phases)p.remaining=0}
function addModel(s,type,variant,status,custom,finishedPhoto=null){if(status===4&&!validFinishedPhoto(finishedPhoto))throw Error('登錄完成上色模型前，請先上傳完工照片。');const no=counter(s,type)+1;setCounter(s,type,no);const m={id:uid(),no,type,variant,status,custom:!!custom,scheme:'',plan:false,start:today(),deadline:addDays(today(),14),phases:phaseData(s.settings.baseline,s.settings.ratios)};if(status===4)registerFinished(m,finishedPhoto);s.models.push(m);return m}
function capacity(s,date){return s.settings.days[parseDate(date).getDay()]||0}
// Earliest-deadline-first allocation; completed work is retained and consumes today's capacity.
function reschedule(s){const retained=s.tasks.filter(t=>t.logged);const used={};retained.filter(t=>t.date>=today()).forEach(t=>used[t.date]=(used[t.date]||0)+t.minutes);const tasks=[...retained];const warnings=[];const models=s.models.filter(m=>m.plan&&eligible(m)).sort((a,b)=>a.deadline.localeCompare(b.deadline)||a.id.localeCompare(b.id));
 for(const m of models){let cursor=m.start>today()?m.start:today();const limit=addDays(today(),1095);let overflow=0,last=null,unallocated=0;for(let p=0;p<4;p++){if(m.phases[p].done)continue;let remaining=m.phases[p].remaining;while(remaining>0&&cursor<=limit){const free=Math.max(0,capacity(s,cursor)-(used[cursor]||0));if(!free){cursor=addDays(cursor,1);continue}const n=Math.min(free,remaining);tasks.push({id:uid(),modelId:m.id,phase:p,date:cursor,minutes:n,logged:false,manual:false});used[cursor]=(used[cursor]||0)+n;remaining-=n;last=cursor;if(cursor>m.deadline)overflow+=n;if(used[cursor]>=capacity(s,cursor))cursor=addDays(cursor,1)}unallocated+=remaining}
 if(overflow||unallocated)warnings.push({modelId:m.id,missing:overflow+unallocated,earliest:unallocated?null:last});}
 s.tasks=tasks;return warnings;
}
function planningWarnings(s=state){return s.models.filter(m=>m.plan&&eligible(m)).map(m=>{const work=s.tasks.filter(t=>t.modelId===m.id&&!t.logged);const allocated=work.reduce((n,t)=>n+t.minutes,0),remaining=m.phases.reduce((n,p)=>n+(p.done?0:p.remaining),0);const missing=work.filter(t=>t.date>m.deadline).reduce((n,t)=>n+t.minutes,0)+Math.max(0,remaining-allocated);return {modelId:m.id,missing,earliest:remaining>allocated?null:work.reduce((d,t)=>d>t.date?d:t.date,'')}}).filter(w=>w.missing>0)}
function warningHTML(){const warnings=planningWarnings();return warnings.map(w=>`<div class="notice warning"><strong>${esc(title(modelBy(w.modelId)))}</strong><br>目標日前缺少 ${hours(w.missing)}。${w.earliest?'依目前設定最早可在 '+w.earliest+' 完成。':'目前無足夠可用時段（最多估算三年），請增加可用時間。'} <button class="link-button" data-action="plan" data-id="${w.modelId}">調整計畫</button></div>`).join('')}

function render(){const labels={home:'OVERVIEW',collection:'COLLECTION',planner:'PAINT SCHEDULE',guides:'COLOUR ARCHIVE'};$('#page-crumb').textContent=labels[page];$$('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')});$('#today-label').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('#content').innerHTML=({home:renderHome,collection:renderCollection,planner:renderPlanner,guides:renderGuides}[page])()+footer()}
function taskHTML(t){const m=state.models.find(x=>x.id===t.modelId);if(!m)return '';const last=!state.tasks.some(x=>x.modelId===m.id&&x.phase===t.phase&&!x.logged&&x.date>t.date);const verb=t.phase===3?'預留':last?'應完成':'進行';return `<div class="task ${t.date<today()&&!t.logged?'overdue':''}"><span class="task-marker"></span><div class="task-content"><div class="task-title">${t.logged?'已記錄工作':verb} ${esc(title(m))} · ${PHASES[t.phase]}</div><div class="task-meta">${t.date} · ${hours(t.minutes)}${t.manual?' · 手動調整':''}${t.phase===3?' · 不需照片':''}</div><div class="task-actions">${t.logged?'<span class="badge gray">當日工作已記錄</span>':`<button data-action="log-task" data-id="${t.id}" ${t.date>today()?'disabled title="未來工作若提早進行，請到模型詳細資料更新剩餘工時或完成階段"':''}>${t.phase===3?'記錄緩衝已使用':'記錄今日工作'}</button><button data-action="move-task" data-id="${t.id}">調整日期</button>`}<button class="ghost" data-action="detail" data-id="${m.id}">查看模型／照片 ↗</button></div></div></div>`}
function pendingConfirmations(){return state.models.flatMap(m=>eligible(m)?m.phases.slice(0,3).map((p,i)=>({m,p,i})).filter(x=>!x.p.done&&x.p.remaining===0):[])}
function confirmationCards(){const list=pendingConfirmations();return list.length?`<section class="card" style="margin-bottom:20px"><div class="card-head"><h2>等待階段確認</h2><span class="badge amber">${list.length}</span></div>${list.map(({m,i})=>`<div class="task"><div class="task-content"><div class="task-title">${esc(title(m))} · ${PHASES[i]}</div><div class="task-meta">預估工時已記錄完畢，請上傳照片確認，或增加剩餘工時。</div><div class="task-actions"><button data-action="detail" data-id="${m.id}">上傳照片／確認階段</button><button data-action="plan" data-id="${m.id}">調整剩餘工時</button></div></div></div>`).join('')}</section>`:''}
function renderHome(){const total=state.models.length,done=state.models.filter(m=>m.status===4).length,active=state.models.filter(m=>m.plan&&eligible(m)).length;const due=state.tasks.filter(t=>!t.logged&&t.date===today()),overdue=state.tasks.filter(t=>!t.logged&&t.date<today());return head('COMMAND OVERVIEW','讓你的軍團，再次甦醒。','一次一隻模型，讓塗裝計畫真正前進。',`<button class="ghost" data-action="reminders">查看提醒</button><button class="primary" data-action="add">＋ 新增模型</button>`)+`<div class="grid stats"><div class="stat"><span class="stat-label">收藏模型</span><span class="number">${total.toString().padStart(2,'0')}</span><small>每隻都有自己的紀錄</small><i>◇</i></div><div class="stat"><span class="stat-label">完成上色</span><span class="number green">${done.toString().padStart(2,'0')}</span><small>完成率 ${total?Math.round(done/total*100):0}%</small><i>✓</i></div><div class="stat"><span class="stat-label">進行中計畫</span><span class="number">${active.toString().padStart(2,'0')}</span><small>依個人時間安排</small><i>↗</i></div><div class="stat"><span class="stat-label">今日任務</span><span class="number ${due.length?'green':''}">${due.length.toString().padStart(2,'0')}</span><small>${overdue.length?'另有 '+overdue.length+' 項逾期任務':'所有步調，由你決定'}</small><i>⌁</i></div></div>${warningHTML()}${confirmationCards()}<div class="grid dashboard-cols"><div class="grid"><section class="card"><div class="card-head"><h2>今日塗裝任務</h2><span class="badge">${fmtDate(today())}</span></div>${due.length?due.map(taskHTML).join(''):empty(total?'今天沒有安排工作':'從第一隻模型開始','把收藏加入軍械庫，設定你可以塗裝的日子，接下來交給計畫。',`<button class="primary" data-page="${total?'planner':'collection'}">${total?'前往時程規劃':'建立我的收藏'} →</button>`)}</section>${overdue.length?`<section class="card"><div class="card-head"><h2>等待重新安排</h2><button data-action="reschedule">重新安排</button></div>${overdue.slice(0,8).map(taskHTML).join('')}${overdue.length>8?'<button data-page="planner">查看所有逾期任務</button>':''}</section>`:''}<section class="card"><div class="eyebrow">PAINTING NOTE / 01</div><h3 style="margin-top:10px">細節值得多一點時間。</h3><p class="muted" style="font-size:13px;margin-bottom:0">預設將 45% 的時間留給細節，另保留 10% 緩衝。計畫是參考，實際進度由你確認。</p></section></div><section class="card"><div class="hero-art">${icon}</div><div class="card-head"><h2>軍械庫概況</h2><span class="badge gray">${total} MODELS</span></div>${STATUS.map((name,i)=>{const n=state.models.filter(m=>m.status===i).length;return `<div class="status-line"><span>${name}</span><span>${n}</span></div><div class="progress-track"><div class="progress-fill" style="width:${total?n/total*100:0}%;opacity:${i===4?1:.4+i*.12}"></div></div>`}).join('')}<button class="ghost" data-page="collection" style="width:100%;margin-top:25px">查看完整收藏 →</button></section></div>`}
function renderCollection(){const types=[...new Set(state.models.map(m=>m.type))].sort();const found=state.models.filter(m=>(!filter.query||(title(m)).toLowerCase().includes(filter.query.toLowerCase()))&&(filter.status===''||m.status===Number(filter.status))&&(!filter.type||m.type===filter.type));return head('THE ARMOURY','模型收藏','依模型與武器配置整理，每隻模型獨立追蹤。',`<button class="primary" data-action="add">＋ 新增模型</button>`)+`<div class="toolbar"><input id="collection-search" aria-label="搜尋收藏" placeholder="搜尋模型、武器或編號…" value="${esc(filter.query)}"><select id="status-filter" aria-label="依狀態篩選"><option value="">全部狀態</option>${STATUS.map((n,i)=>`<option value="${i}" ${filter.status===String(i)?'selected':''}>${n}</option>`).join('')}</select><select id="type-filter" aria-label="依模型種類篩選"><option value="">全部模型</option>${types.map(n=>`<option ${filter.type===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="source-note">${esc(CATALOG_INFO.label)} · 查核 ${CATALOG_INFO.date} · <a href="${SOURCES.mfm}" target="_blank" rel="noopener">官方 MFM ↗</a></div><p class="muted" style="font-size:12px">顯示 ${found.length} / ${state.models.length} 隻模型</p><div class="grid model-grid">${groupCards(found)}</div>${!found.length?`<section class="card">${empty(state.models.length?'沒有符合條件的模型':'你的軍械庫，等待啟動。',state.models.length?'試著變更搜尋文字或篩選條件。':'勾選模型與武器配置，輸入數量即可建立收藏。',state.models.length?'<button data-action="reset-filter">清除篩選</button>':'<button class="primary" data-action="add">＋ 新增第一隻模型</button>')}</section>`:''}`}
function groupCards(models){const groups=new Map();for(const m of models){const key=JSON.stringify([m.type,m.variant]);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(m)}return [...groups.values()].map(list=>`<h2 style="grid-column:1/-1;margin:12px 0 0;font-size:14px;color:var(--muted)">${esc(list[0].type)} · ${esc(list[0].variant)} <span class="badge gray">${list.length} 隻</span></h2>${list.sort((a,b)=>a.no-b.no).map(modelCard).join('')}`).join('')}

function renderPlanner(){const active=state.models.filter(m=>m.plan&&eligible(m));const tasks=state.tasks.filter(t=>!t.logged).sort((a,b)=>a.date.localeCompare(b.date)||a.phase-b.phase);const groups=Object.groupBy?Object.groupBy(tasks,t=>t.date):tasks.reduce((a,t)=>((a[t.date]??=[]).push(t),a),{});return head('PAINT PROTOCOL','時程規劃','先設定你的步調，再安排每一隻模型。',`<button class="ghost" data-action="settings">可用時間設定</button><button class="primary" data-action="choose-plan">＋ 新增計畫</button>`)+warningHTML()+`<div class="grid split"><div class="grid" style="align-content:start"><section class="card"><div class="card-head"><h2>我的塗裝步調</h2><button class="ghost" data-action="settings">編輯</button></div><div class="info-row"><span class="muted">兵線模型基準</span><strong>${hours(state.settings.baseline)}</strong></div><div class="info-row"><span class="muted">每週可用時間</span><strong>${hours(state.settings.days.reduce((a,b)=>a+b,0))}</strong></div><div class="legend"><span>可塗裝</span><span>緩衝</span></div>${state.settings.days.map((n,i)=>n?`<div class="info-row"><span>週${'日一二三四五六'[i]}</span><span>${hours(n)}</span></div>`:'').join('')}<div class="notice">${state.settings.ratios.map((r,i)=>`${PHASES[i]} ${r}%`).join(' ／ ')}</div></section><section class="card"><div class="card-head"><h2>模型計畫</h2><span class="badge gray">${active.length}</span></div>${active.length?active.map(m=>`<div class="task"><div class="task-content"><div class="task-title">${esc(title(m))}</div><div class="task-meta">目標 ${m.deadline} · 剩餘 ${hours(m.phases.reduce((n,p)=>n+(p.done?0:p.remaining),0))}</div><div class="task-actions"><button data-action="plan" data-id="${m.id}">工時／期限</button><button data-action="detail" data-id="${m.id}">階段進度</button><button class="ghost danger" data-action="cancel-plan" data-id="${m.id}">取消計畫</button></div></div></div>`).join(''):empty('尚未安排模型','已噴底漆或上色中的模型才能加入計畫。')}</section></div><section class="card"><div class="card-head"><h2>工作日程</h2><button data-action="reschedule">重新安排／提前安排</button></div><p class="muted" style="font-size:12px">優先安排較早到期的模型。重新安排會重算尚未完成的工作，包含手動修改的日期。</p>${tasks.length?Object.entries(groups).slice(0,60).map(([date,items])=>`<section class="schedule-group"><div class="date-label"><span>${date} · ${fmtDate(date)}</span><span>${hours(items.reduce((n,t)=>n+t.minutes,0))} / ${hours(capacity(state,date))}</span></div><div style="padding-top:15px">${items.map(taskHTML).join('')}</div></section>`).join('')+(Object.keys(groups).length>60?'<p class="muted">此處顯示前 60 個工作日；全部日程會包含在備份中。</p>':''):empty('日程還是空白的','新增模型計畫後，這裡會顯示每日工作。')}<details style="margin-top:24px"><summary>已記錄的工作（${state.tasks.filter(t=>t.logged).length}）</summary><div style="margin-top:15px">${state.tasks.filter(t=>t.logged).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(taskHTML).join('')||'<p class="muted">還沒有工作紀錄。</p>'}</div></details></section></div>`}
function paintLink(name){return PAINT_URLS[name]?'https://www.warhammer.com/en-GB/shop/'+PAINT_URLS[name]:'https://www.warhammer.com/en-GB/plp?search='+encodeURIComponent(name)}
function renderGuides(){const descriptions=[['從乾淨的底色開始','少量多次上色，保持分色清楚；金屬內構、裝甲與武器可分開處理。不要為了追求一次覆蓋而堆積厚漆。',['用調色盤控制漆量，依漆種適量稀釋','先處理主要色塊，避免覆蓋雕刻細節','乾燥後再補第二層，檢查漏色']],['把時間留給細節','依模型挑選眼睛、能量管線、符號與武器細節。修正溢色也是這個階段的一部分。',['保持筆尖與支撐手穩定','由大到小處理細節，溢色以底色修回','需要時少量提亮邊緣，避免整片覆蓋']],['讓凹陷與層次出現','依表面選擇陰影漆，少量施於需要加深的位置。留意平面積漆與乾燥後的污漬。',['先在不明顯的位置測試','移除凹槽外多餘積漆，避免反覆攪動半乾漆','乾燥後檢查明暗，必要時補回亮面']]];return head('COLOUR ARCHIVE','塗裝參考','從基本技巧到配色方向，為每隻模型找到起點。')+`<div class="notice">三階段為本工具的規劃流程，可依實際技法調整。以下教學文字為整理建議；官方影片與商品資料另附連結。</div><div class="grid guide-grid">${descriptions.map((d,i)=>`<article class="card"><div class="guide-no">0${i+1}</div><h2>${PHASES[i]}</h2><h3>${d[0]}</h3><p class="muted" style="font-size:14px">${d[1]}</p><ul>${d[2].map(x=>`<li>${x}</li>`).join('')}</ul><details><summary>完成檢查項目</summary><ul>${CHECKS[i].map(c=>`<li>${c}</li>`).join('')}</ul></details></article>`).join('')}</div><div class="guide-links"><a href="${SOURCES.paint}" target="_blank" rel="noopener">Citadel 官方技巧教學 ↗</a><a href="${SOURCES.dynasties}" target="_blank" rel="noopener">官方太空死靈王朝配色集 ↗</a><a href="${SOURCES.shop}" target="_blank" rel="noopener">Necrons 官方商品 ↗</a><a href="${SOURCES.downloads}" target="_blank" rel="noopener">官方規則下載 ↗</a></div><h2 style="margin-top:35px">配色方案</h2><p class="muted" style="font-size:13px">使用 Citadel 漆料；色塊為螢幕示意，非漆料精準色票。方案可在模型詳細資料中套用。</p><div class="grid recipe-grid">${RECIPES.map(r=>`<article class="card"><span class="eyebrow">${r.subtitle}</span><h2 style="margin-top:10px">${r.name}</h2><div class="swatches">${r.colors.map(c=>`<span class="swatch" style="background:${c}" aria-hidden="true"></span>`).join('')}</div><ul class="paint-list">${r.paints.map(([part,name])=>`<li>${part}：<a href="${paintLink(name)}" target="_blank" rel="noopener">${name} ↗</a></li>`).join('')}</ul><small>${r.note}</small>${r.source?`<div class="guide-links"><a href="${r.source}" target="_blank" rel="noopener">${r.sourceLabel} ↗</a></div>`:''}</article>`).join('')}</div><section class="card" style="margin-top:24px"><h3>模型與官方資料</h3><p class="muted" style="font-size:13px">${esc(CATALOG_INFO.note)} 查核日期：${CATALOG_INFO.date}。官方商品頁可能因地區或改版調整；請由連結確認實際照片與商品資訊。僅確認有旋轉檢視時才標示該功能。</p><div class="guide-links"><a href="${SOURCES.mfm}" target="_blank" rel="noopener">Munitorum Field Manual ↗</a><a href="${SOURCES.shop}" target="_blank" rel="noopener">查看官方模型 ↗</a></div></section>`}
function showAdd(){modal('新增模型至收藏',`<p class="muted">勾選配置與數量，每隻會自動取得同款模型的連續編號。</p><div class="notice warning">${esc(CATALOG_INFO.note)} <a href="${SOURCES.mfm}" target="_blank" rel="noopener">查看官方 MFM</a></div><form id="add-form"><div class="field"><label for="catalog-search">搜尋模型或武器</label><input id="catalog-search" placeholder="例如 Warrior、Gauss…"></div><div class="catalog-list" id="catalog-list">${CATALOG.filter(c=>!c.custom).flatMap((c,ci)=>c.variants.map((v,vi)=>`<div class="catalog-item" data-search="${esc((c.name+' '+v).toLowerCase())}"><input type="checkbox" id="pick-${ci}-${vi}" name="pick" value="${ci}:${vi}" aria-label="選取 ${esc(c.name+' - '+v)}"><label for="pick-${ci}-${vi}">${esc(c.name)}<small>${esc(v)}${c.verified?'':' · 配置待官方核對'}</small></label><input type="number" name="qty-${ci}-${vi}" min="1" max="200" step="1" value="1" aria-label="${esc(c.name+' '+v)} 數量"></div>`)).join('')}</div><details><summary>＋ 自訂模型／Kitbash</summary><div class="fields" style="margin-top:15px"><div class="field"><label for="custom-name">英文模型名稱</label><input id="custom-name" maxlength="100" placeholder="例如 Custom Overlord"></div><div class="field"><label for="custom-variant">武器／改造配置</label><input id="custom-variant" maxlength="150" placeholder="例如 Converted staff"></div></div><div class="field"><label for="custom-qty">自訂模型數量</label><input id="custom-qty" type="number" min="1" max="200" step="1" value="1"></div></details><div class="field" style="margin-top:20px"><label for="add-status">本次新增模型的初始狀態</label><select id="add-status">${STATUS.map((s,i)=>`<option value="${i}">${s}</option>`).join('')}</select><small>若選擇「完成上色」，必須附上完工照片；不必補拍過去的三階段照片。</small></div><section id="finished-upload" class="phase hidden"><h3>完工照片（必填）</h3><p class="muted" style="font-size:13px">同時新增多隻時，這張照片會附在每隻模型的完工紀錄，請讓照片包含本次登錄的模型。不同照片請分次新增。</p><label for="add-finished-photo">上傳完工照片（JPG、PNG、WebP，最大 20 MB）</label><input id="add-finished-photo" type="file" accept="image/jpeg,image/png,image/webp"><img id="add-finished-preview" class="photo hidden" alt="本次新增模型的完工照片預覽"><small>只記錄完工照片與登錄日期，不補造三階段的歷史紀錄。</small></section><div class="dialog-foot"><button type="button" data-action="close">取消</button><button class="primary" type="submit">加入收藏</button></div></form>`)}
function showSettings(){modal('設定你的塗裝步調',`<form id="settings-form"><p class="muted">以一隻基礎兵線模型為基準，估算包含修正緩衝的總時間。</p><div class="actions" style="margin-bottom:18px">${[1,2,3,5,8].map(h=>`<button type="button" data-action="set-baseline" data-hours="${h}">${h} 小時</button>`).join('')}</div><div class="field"><label for="baseline">一隻基礎兵線模型的總工時（小時）</label><input id="baseline" type="number" min="0.25" max="500" step="0.25" value="${state.settings.baseline/60}" list="baseline-options" required><datalist id="baseline-options"><option value="1"><option value="2"><option value="3"><option value="5"><option value="8"></datalist></div><h3>每週哪些日子可以塗裝？</h3><small>勾選後輸入當日可用小時數。</small>${[1,2,3,4,5,6,0].map(i=>`<div class="week-row"><label><input type="checkbox" id="day-${i}" ${state.settings.days[i]?'checked':''}>週${'日一二三四五六'[i]}</label><input type="number" id="hours-${i}" value="${state.settings.days[i]/60||1}" min="0.25" max="16" step="0.25" aria-label="週${'日一二三四五六'[i]}可用小時" required></div>`).join('')}<h3 style="margin-top:24px">預設時間比例</h3><div class="ratio">${PHASES.map((n,i)=>`<div class="field"><label for="ratio-${i}">${n} %</label><input id="ratio-${i}" type="number" min="1" max="97" step="1" value="${state.settings.ratios[i]}" required></div>`).join('')}</div><div class="notice">比例僅套用到之後新建或重新估算的計畫。變更可用時間會重新安排所有尚未完成的工作，包含手動調整的日期。</div><div class="dialog-foot"><button type="button" data-action="close">取消</button><button class="primary">儲存並重新安排</button></div></form>`)}
function choosePlan(){const models=state.models.filter(eligible);modal('選擇單隻模型',models.length?`<p class="muted">每隻模型獨立設定工時與目標日期。</p>${models.map(m=>`<div class="task"><div class="task-content"><strong>${esc(title(m))}</strong><div class="task-meta">${STATUS[m.status]}${m.plan?' · 已有計畫':''}</div></div><button data-action="plan" data-id="${m.id}">選擇</button></div>`).join('')}`:empty('沒有可安排的模型','先將收藏中的模型狀態設為「已噴底漆」或「上色中」。','<button data-page="collection">前往收藏</button>'))}
function showPlan(id){const m=structuredClone(modelBy(id));if(!m.plan&&!m.phases.some(p=>p.done)&&!state.tasks.some(t=>t.modelId===id&&t.logged))m.phases=phaseData(state.settings.baseline,state.settings.ratios);if(!eligible(m))throw Error('只有已噴底漆或上色中的模型可以排程。');activeModel=id;const remaining=m.phases.reduce((n,p)=>n+(p.done?0:p.remaining),0);modal('安排單隻模型',`<form id="plan-form" data-id="${id}"><h3>${esc(title(m))}</h3><div class="fields"><div class="field"><label for="plan-start">開始日期</label><input type="date" id="plan-start" value="${m.start}" required></div><div class="field"><label for="plan-deadline">目標完成日期</label><input type="date" id="plan-deadline" value="${m.deadline}" required></div></div><div class="field"><label for="plan-total">重新估算用總工時（小時，含緩衝）</label><input type="number" id="plan-total" min="0.25" max="2000" step="0.25" value="${Math.max(.25,m.phases.reduce((n,p)=>n+p.total,0)/60)}" required><small>大型模型請自行估算。按下方按鈕才會依比例重新分配工時。</small></div><button type="button" data-action="distribute">依目前比例重新分配未完成階段</button><div class="notice">目前比例：${state.settings.ratios.join(' / ')}%。已完成的階段請在「進度與照片」確認，這裡只調整剩餘工時。</div><div class="fields">${PHASES.map((n,i)=>`<div class="field"><label for="remain-${i}">${n}剩餘分鐘${m.phases[i].done?'（已完成）':''}</label><input type="number" id="remain-${i}" min="0" max="120000" step="1" value="${m.phases[i].done?0:m.phases[i].remaining}" ${m.phases[i].done?'disabled':''} required></div>`).join('')}</div><small>目前剩餘 ${hours(remaining)}。跨日工作完成後可在詳細資料修改；零分鐘仍不等於階段已完成。</small><div class="dialog-foot"><button type="button" data-action="detail" data-id="${id}">進度與照片</button><button class="primary">儲存並自動排程</button></div></form>`)}
function officialModelLink(m){const c=CATALOG.find(c=>c.name===m.type);return c?.url||'https://www.warhammer.com/en-GB/plp?search='+encodeURIComponent(c?.unit||m.type)}

.photo?'替換':'上傳'}照片（JPG、PNG、WebP，最大 20 MB）</label><input type="file" accept="image/jpeg,image/png,image/webp" id="photo-${i}" data-photo-id="${id}" data-phase="${i}"></div><div class="check-list">${CHECKS[i].map((c,ci)=>`<label><input type="checkbox" data-check-phase="${i}" data-check-index="${ci}" ${p.done||p.checks?.includes(ci)?'checked':''} ${p.done?'disabled':''}>${c}</label>`).join('')}</div><div class="actions" style="margin-top:14px">${p.done?`<button data-action="undo-phase" data-id="${id}" data-phase="${i}">撤回本階段及後續完成</button>`:`<button class="primary" data-action="complete-phase" data-id="${id}" data-phase="${i}" ${!eligible(m)?'disabled':''}>確認階段完成</button>`}</div></section>`).join('')}<div class="notice">一般塗裝計畫：每日工作記錄會扣除剩餘工時；階段完成需要各階段的照片與檢查確認。提早完成後，可選擇提前安排後續工作。</div><div class="actions">${eligible(m)?`<button data-action="plan" data-id="${id}">調整剩餘工時／計畫</button>`:''}${eligible(m)?'<button data-action="reschedule">提前安排後續工作</button>':''}<button class="danger ghost" data-action="delete-model" data-id="${id}">刪除此模型</button></div>`)}

function validateState(s){const fail=()=>{throw Error('備份格式不完整或資料無效；目前資料未變更。')};const num=(v,min,max)=>Number.isFinite(v)&&Number.isInteger(v)&&v>=min&&v<=max;const date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(parseDate(v).getTime())&&localDate(parseDate(v))===v;const str=(v,n)=>typeof v==='string'&&v.length<=n;const photo=v=>v===null||(typeof v==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v)&&v.length<6000000);
 if(!s||s.version!==VERSION||!Array.isArray(s.models)||s.models.length>10000||!Array.isArray(s.tasks)||s.tasks.length>300000||!s.settings||!s.counters||typeof s.counters!=='object'||Array.isArray(s.counters))fail();const st=s.settings;if(!num(st.baseline,1,120000)||!Array.isArray(st.days)||st.days.length!==7||!st.days.every(v=>num(v,0,960))||!Array.isArray(st.ratios)||st.ratios.length!==4||!st.ratios.every(v=>num(v,1,97))||st.ratios.reduce((a,b)=>a+b,0)!==100)fail();const ids=new Set(),numbers=new Set();for(const m of s.models){if(!str(m.id,100)||!m.id||ids.has(m.id)||!str(m.type,100)||!m.type.trim()||!str(m.variant,150)||!num(m.no,1,1000000)||!num(m.status,0,4)||typeof m.plan!=='boolean'||typeof m.custom!=='boolean'||!date(m.start)||!date(m.deadline)||!['',...RECIPES.map(r=>r.id)].includes(m.scheme)||!Array.isArray(m.phases)||m.phases.length!==4)fail();ids.add(m.id);const key=JSON.stringify([m.type,m.no]);if(numbers.has(key))fail();numbers.add(key);for(const [i,p]of m.phases.entries()){if(!num(p.total,0,120000)||!num(p.remaining,0,120000)||typeof p.done!=='boolean'||!photo(p.photo)||!Array.isArray(p.checks)||!p.checks.every(c=>num(c,0,1))||(p.doneDate!==null&&!date(p.doneDate)))fail();if(p.remaining>p.total)fail();if(p.done&&(p.remaining!==0||!p.doneDate||(i<3&&!p.photo)))fail();if(i<3&&p.done&&m.phases.slice(0,i).some(previous=>!previous.done))fail()}if(m.finishedPhoto!=null&&(!validFinishedPhoto(m.finishedPhoto)||!date(m.finishedRegisteredAt)))fail();if(m.finishedPhoto==null&&m.finishedRegisteredAt!=null)fail();if(m.status===4&&!m.phases.slice(0,3).every(p=>p.done)&&!validFinishedPhoto(m.finishedPhoto))fail();if(m.plan&&!eligible(m))fail();if(!num(s.counters[m.type],m.no,1000000))fail()}
 const taskIds=new Set();for(const t of s.tasks){if(!str(t.id,100)||!t.id||taskIds.has(t.id)||!ids.has(t.modelId)||!num(t.phase,0,3)||!date(t.date)||!num(t.minutes,1,960)||typeof t.logged!=='boolean'||typeof t.manual!=='boolean')fail();taskIds.add(t.id);const model=s.models.find(m=>m.id===t.modelId);if(!t.logged&&(!model.plan||!eligible(model)||model.phases[t.phase].done||t.date<model.start))fail()}
 const remainingTasks=new Map(),daily=new Map();for(const t of s.tasks){if(!t.logged){const key=JSON.stringify([t.modelId,t.phase]);remainingTasks.set(key,(remainingTasks.get(key)||0)+t.minutes)}const d=daily.get(t.date)||{logged:0,open:0};d[t.logged?'logged':'open']+=t.minutes;daily.set(t.date,d)}for(const m of s.models)for(let i=0;i<4;i++)if((remainingTasks.get(JSON.stringify([m.id,i]))||0)>m.phases[i].remaining)fail();for(const [date,d] of daily)if(d.open>Math.max(0,capacity(s,date)-d.logged))fail();return true;
}
async function resizePhoto(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('請選擇 JPG、PNG 或 WebP 圖片。');if(file.size>20*1024*1024)throw Error('照片超過 20 MB，請先縮小。');const bitmap=await createImageBitmap(file);try{if(bitmap.width*bitmap.height>60000000)throw Error('圖片尺寸過大，請先縮小。');const scale=Math.min(1,1200/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bitmap.width*scale));c.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(bitmap,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.78)}finally{bitmap.close()}}

async function processImport(file){pendingImport=null;if(file.size>200*1024*1024)throw Error('備份超過 200 MB，無法在此工具匯入。');const parsed=JSON.parse(await file.text());if(parsed.app!=='REAWAKEN')throw Error('這不是 REAWAKEN 備份檔。');validateState(parsed.data);pendingImport=parsed.data;const photos=pendingImport.models.reduce((n,m)=>n+m.phases.filter(p=>p.photo).length+(m.finishedPhoto?1:0),0);$('#import-summary').innerHTML=`<div class="notice">檢查通過：${pendingImport.models.length} 隻模型、${pendingImport.tasks.length} 筆工作、${photos} 張照片。<br>將取代目前 ${state.models.length} 隻模型與相關紀錄。</div><button class="danger" data-action="confirm-import">確認取代並還原</button>`}

function reopenPhases(m,i){if(directFinished(m))for(const p of m.phases)if(!p.done)p.remaining=p.total;for(let j=i;j<4;j++){if(m.phases[j].done){m.phases[j].remaining=m.phases[j].total;m.phases[j].done=false;m.phases[j].doneDate=null;m.phases[j].checks=[]}}if(m.status===4)m.status=3}

 if(el.dataset.statusId){const id=el.dataset.statusId,next=Number(el.value),m=modelBy(id);if(next===4&&!m.phases.slice(0,3).every(p=>p.done)&&!validFinishedPhoto(m.finishedPhoto)){render();showDetail(id);throw Error('完成上色前，請先補齊三階段照片與確認。')}if(next<2&&(m.plan||m.phases.some(p=>p.done))&&!await askConfirm('改回前置狀態會取消計畫並撤回完成確認，照片保留。是否繼續？')){render();return}await mutate(s=>{const x=s.models.find(x=>x.id===id);if(next<2){x.plan=false;reopenPhases(x,0)}else if(next!==4&&directFinished(x))reopenPhases(x,0);if(next===4){x.plan=false;x.phases[3].remaining=0;x.phases[3].done=true;x.phases[3].doneDate=today()}x.status=next;reschedule(s)});notify('模型狀態已更新。')}
 if(el.id==='scheme-select'){const id=el.dataset.modelId;await mutate(s=>{s.models.find(m=>m.id===id).scheme=el.value});showDetail(id)}
 if(el.dataset.photoId&&el.files[0]){const id=el.dataset.photoId,i=Number(el.dataset.phase);notify('正在縮小並儲存照片…');const photo=await resizePhoto(el.files[0]);await mutate(s=>{s.models.find(m=>m.id===id).phases[i].photo=photo});showDetail(id);notify('照片已儲存在瀏覽器。')}
 if(el.id==='import-file'&&el.files[0]){pendingImport=null;$('#import-summary').textContent='正在檢查備份…';try{await processImport(el.files[0])}catch(err){$('#import-summary').textContent='檔案未通過檢查，目前資料未變更。';throw err}}
 }catch(err){console.error(err);notify(err.message||'儲存失敗，請檢查瀏覽器空間。',true);if(el.dataset.statusId)render()}});
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;if(form.dataset.submitting==='true')return;try{
 if(form.id==='add-form'){form.dataset.submitting='true';form.querySelector('[type=submit]').disabled=true;const picks=[...form.querySelectorAll('[name=pick]:checked')].map(el=>{const [ci,vi]=el.value.split(':').map(Number),q=Number(form.elements['qty-'+ci+'-'+vi].value),c=CATALOG.filter(c=>!c.custom)[ci];if(!Number.isInteger(q)||q<1||q>200)throw Error('每次每種配置請輸入 1～200 隻。');return {type:c.name,variant:c.variants[vi],q,custom:!c.verified}});const type=$('#custom-name').value.trim(),variant=$('#custom-variant').value.trim(),q=Number($('#custom-qty').value);if(type){if(!/[A-Za-z]/.test(type))throw Error('請在自訂模型名稱中使用英文。');if(!Number.isInteger(q)||q<1||q>200)throw Error('自訂數量請輸入 1～200。');picks.push({type,variant,q,custom:true})}if(!picks.length)throw Error('請至少勾選一個模型，或輸入自訂模型。');const status=Number($('#add-status').value),count=picks.reduce((n,p)=>n+p.q,0);if(state.models.length+count>10000)throw Error('收藏最多支援 10,000 隻模型。');let finishedPhoto=null;if(status===4){const file=$('#add-finished-photo').files[0];if(!file)throw Error('登錄完成上色模型前，請先上傳完工照片。');notify('正在處理完工照片並登錄收藏…');finishedPhoto=await resizePhoto(file)}await mutate(s=>picks.forEach(p=>{for(let i=0;i<p.q;i++)addModel(s,p.type,p.variant,status,p.custom,finishedPhoto)}));closeModal();page='collection';filter={query:'',status:'',type:''};render();notify('已加入 '+count+' 隻模型，每隻都有獨立編號。')}
 if(form.id==='settings-form'){const baseline=minutes($('#baseline').value),days=Array.from({length:7},(_,i)=>$('#day-'+i).checked?minutes($('#hours-'+i).value):0),ratios=Array.from({length:4},(_,i)=>Number($('#ratio-'+i).value));if(baseline<15||baseline>30000||!Number.isInteger(baseline))throw Error('請輸入有效基準工時。');if(!days.some(Boolean))throw Error('請至少選擇一個可塗裝日。');if(days.some(v=>!Number.isInteger(v)||v<0||v>960))throw Error('每天可用時間需在 0～16 小時內。');if(ratios.reduce((a,b)=>a+b,0)!==100||ratios.some(v=>!Number.isInteger(v)||v<1))throw Error('四項比例需為正整數，合計 100%。');await mutate(s=>{s.settings={baseline,days,ratios};reschedule(s)});closeModal();notify('時間設定已儲存，未完成工作已重新安排。')}
 if(form.id==='plan-form'){const id=form.dataset.id,start=$('#plan-start').value,deadline=$('#plan-deadline').value,rem=Array.from({length:4},(_,i)=>Number($('#remain-'+i).value));if(deadline<start)throw Error('目標日期不能早於開始日期。');if(rem.some(v=>!Number.isInteger(v)||v<0||v>120000))throw Error('剩餘工時需為 0～120,000 分鐘。');await mutate(s=>{const m=s.models.find(m=>m.id===id);m.start=start;m.deadline=deadline;m.plan=true;for(let i=0;i<4;i++)if(!m.phases[i].done){m.phases[i].remaining=rem[i];m.phases[i].total=rem[i]+s.tasks.filter(t=>t.logged&&t.modelId===id&&t.phase===i).reduce((n,t)=>n+t.minutes,0)}reschedule(s)});closeModal();page='planner';render();notify('計畫已儲存。若時間不足，日程上方會顯示警告。')}
 if(form.id==='identity-form'){const id=form.dataset.id,type=$('#edit-type').value.trim(),variant=$('#edit-variant').value.trim();if(!type||!/[A-Za-z]/.test(type))throw Error('請輸入英文模型名稱。');await mutate(s=>{const m=s.models.find(m=>m.id===id);if(s.models.some(x=>x.id!==id&&x.type===type&&x.no===m.no))throw Error('改名後會與另一隻同款模型編號衝突，請使用不同名稱。');if(m.type!==type||m.variant!==variant)m.custom=true;m.type=type;m.variant=variant;setCounter(s,type,Math.max(counter(s,type),m.no))});showDetail(id);notify('名稱與配置已更新，編號保留。')}
 if(form.id==='move-form'){const id=form.dataset.id,date=$('#move-date').value;if(date<today())throw Error('請選擇今天或之後的日期。');await mutate(s=>{const t=s.tasks.find(t=>t.id===id),m=s.models.find(m=>m.id===t.modelId);if(date<m.start)throw Error('不能早於模型計畫開始日。');const used=s.tasks.filter(x=>x.id!==id&&x.date===date).reduce((n,x)=>n+x.minutes,0);if(used+t.minutes>capacity(s,date))throw Error('超出當日可用時間，請選其他日期或增加可用時間。');const others=s.tasks.filter(x=>x.id!==id&&x.modelId===t.modelId);if(others.some(x=>(x.phase<t.phase&&x.date>date)||(x.phase>t.phase&&x.date<date)))throw Error('調整後會打亂塗裝階段順序，請選其他日期。');t.date=date;t.manual=true});closeModal();notify('工作日期已調整。')}
 }catch(err){console.error(err);notify(err.message||'操作失敗，資料未儲存。',true)}finally{if(form.id==='add-form'){form.dataset.submitting='false';form.querySelector('[type=submit]').disabled=false}}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
async function init(){render();try{db=await openDB();const stored=await readDB();if(stored){validateState(stored);state=stored}$('#save-state').textContent='已儲存在此瀏覽器';render();showReminders()}catch(err){db=null;$('#save-state').textContent='儲存空間無法使用';notify('無法讀取瀏覽器資料：'+err.message+'。請勿清除資料，可先重新開啟一般瀏覽模式。',true)}}
init();
</script>
</body>
